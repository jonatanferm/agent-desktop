# A deliberately small desktop with no physical input devices or host keybinds.
# The launcher prepends the output resolution (AGENT_DESKTOP_RESOLUTION, default 1280x800).
# Tabs keep every window full size and show what is open; dialogs still float.
workspace_layout tabbed
default_border pixel 1
focus_follows_mouse no
mouse_warping none
focus_on_window_activation focus
xwayland enable
